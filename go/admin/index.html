<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#C7413B" />
  <title>gogogo lead code generator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/assets/go-qr.js"></script>
  <style>
    :root {
      --red: #C7413B;
      --paper: #F7F5F0;
      --ink: rgba(52, 34, 32, 0.9);
      --ink-on-red: rgba(247, 245, 240, 0.9);
      --btn-ink: rgba(170, 58, 52, 0.9);
      --placeholder: rgba(110, 88, 84, 0.9);
      --display: "Space Grotesk", system-ui, sans-serif;
      --max: 420px;
      --pad: 24px;
      --radius: 2px;
      --chrome-bg: #ececeb;
      --chrome-width: min(100% - 32px, 390px);
      --chrome-radius: 22px;
      --header-h: 52px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--display);
      background: var(--red);
      color: var(--ink-on-red);
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: inherit; text-decoration: none; }

    .site-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: center;
      padding: 14px 16px 0; pointer-events: none;
    }
    .site-header {
      pointer-events: auto;
      width: var(--chrome-width);
      display: grid; grid-template-columns: 44px 1fr auto;
      align-items: center; height: var(--header-h);
      padding: 0 8px; background: var(--chrome-bg);
      border-radius: var(--chrome-radius); color: var(--ink);
    }
    .site-header__brand { justify-self: center; font-weight: 600; font-size: 0.92rem; }
    .site-header__left, .site-header__right {
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn {
      width: 40px; height: 40px; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .icon-btn__burger {
      position: relative; width: 18px; height: 12px; display: block;
    }
    .icon-btn__burger i,
    .icon-btn__burger::before,
    .icon-btn__burger::after {
      content: ""; position: absolute; left: 0; width: 18px; height: 1.5px;
      background: var(--ink); border-radius: 1px;
      transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;
    }
    .icon-btn__burger i { top: 5px; display: block; }
    .icon-btn__burger::before { top: 0; }
    .icon-btn__burger::after { top: 10px; }
    .icon-btn.is-open .icon-btn__burger i { opacity: 0; }
    .icon-btn.is-open .icon-btn__burger::before { top: 5px; transform: rotate(45deg); }
    .icon-btn.is-open .icon-btn__burger::after { top: 5px; transform: rotate(-45deg); }
    .auth-btn {
      padding: 0 10px; height: 40px;
      font-weight: 700; font-size: 0.78rem; letter-spacing: -0.02em;
      color: var(--ink);
    }
    .menu-panel {
      position: fixed; inset: 0; z-index: 55; display: none;
      align-items: flex-start; justify-content: center;
      padding: calc(14px + var(--header-h) + 10px) 16px 24px;
      background: rgba(10, 10, 10, 0.18);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .menu-panel.is-open { display: flex; }
    .menu-panel__sheet {
      width: var(--chrome-width); background: rgba(246, 246, 244, 0.96);
      padding: 28px 22px 26px; border-radius: var(--chrome-radius); color: var(--ink);
    }
    .menu-panel__nav {
      display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
    }
    .menu-panel__nav button,
    .menu-panel__nav a {
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      font-weight: 700; letter-spacing: -0.02em;
    }
    body.menu-open { overflow: hidden; }
    body.menu-open .site-top { z-index: 70; }

    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: calc(14px + var(--header-h) + 24px + env(safe-area-inset-top)) var(--pad) calc(40px + env(safe-area-inset-bottom));
    }
    .cycle-wrap {
      display: block;
      width: 240px;
      height: 240px;
      margin: 0 auto 28px;
      padding: 0;
    }
    .cycle-wrap.is-back {
      cursor: pointer;
      border-radius: 50%;
    }
    .cycle-wrap.is-back:focus-visible {
      outline: 2px solid var(--ink-on-red);
      outline-offset: 4px;
    }
    .cycle { width: 240px; height: 240px; display: block; pointer-events: none; }
    .cycle.is-spinning { animation: spin 120s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cycle.is-spinning { animation: none; } }
    h1 {
      font-weight: 700;
      font-size: clamp(28px, 8vw, 36px);
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 28px;
      color: var(--ink-on-red);
    }
    .admin-name {
      display: block;
      width: 100%;
      margin: -4px 0 24px;
      font-weight: 700;
      font-size: clamp(1.5rem, 6vw, 2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
      color: var(--ink-on-red);
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .admin-name[hidden] { display: none; }
    .admin-name:disabled { opacity: 0.55; cursor: wait; }
    .result-meta {
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      opacity: 0.95;
    }
    .field {
      display: block; width: 100%; margin-bottom: 12px; padding: 14px;
      background: var(--paper); color: var(--ink);
      border: 1px solid transparent; border-radius: var(--radius);
      font-size: 16px; font-weight: 500; letter-spacing: -0.02em;
    }
    .field::placeholder { color: var(--placeholder); }
    .field:focus { outline: none; border-color: var(--ink); }
    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
      align-items: stretch;
    }
    .field-row .field { margin-bottom: 0; }
    .btn-gen {
      padding: 0 14px;
      background: var(--paper);
      color: var(--btn-ink);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: -0.02em;
      border-radius: var(--radius);
      white-space: nowrap;
    }
    .btn-gen:hover { opacity: 0.92; }
    .hint {
      margin: -4px 0 12px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      opacity: 0.85;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 56px; background: var(--paper); color: var(--btn-ink);
      font-weight: 700; font-size: 1rem; letter-spacing: -0.03em;
      border-radius: var(--radius);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .msg { min-height: 1.2em; margin-top: 12px; font-size: 0.85rem; font-weight: 500; }
    .msg.is-error { text-decoration: underline; }
    .panel[hidden] { display: none !important; }
    .qr-box {
      padding: 0;
      background: transparent;
      text-align: center;
      color: var(--ink-on-red);
    }
    .qr-box #qr-mount {
      width: 220px; height: 220px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .qr-box #qr-mount img,
    .qr-box #qr-mount canvas,
    .qr-box #qr-mount table {
      display: block; width: 220px; height: 220px;
      background: transparent !important;
    }
    .qr-box a { color: var(--ink-on-red); word-break: break-all; font-size: 0.85rem; font-weight: 600; }
    .list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .list-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }
    .list-item {
      width: 100%; text-align: left;
      background: var(--paper); color: var(--ink);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .list-item strong {
      display: block; font-size: 1.05rem; letter-spacing: -0.03em;
    }
    .list-item span {
      display: block; margin-top: 4px; font-size: 0.85rem; font-weight: 500; opacity: 0.8;
    }
    .list-row.is-paused .list-item { opacity: 0.55; }
    .list-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 88px;
    }
    .list-action {
      flex: 1;
      min-height: 36px;
      background: var(--paper);
      color: var(--btn-ink);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: -0.02em;
      border-radius: var(--radius);
      padding: 0 8px;
    }
    .list-action:hover { opacity: 0.92; }
    .list-action:disabled { opacity: 0.45; cursor: wait; }
    .list-action.is-on {
      background: var(--ink);
      color: var(--paper);
    }
    .empty {
      text-align: center; font-weight: 500; opacity: 0.9;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>
  <div class="site-top">
    <header class="site-header">
      <div class="site-header__left">
        <button class="icon-btn" id="btn-menu" type="button" aria-label="Menü" aria-expanded="false">
          <span class="icon-btn__burger"><i></i></span>
        </button>
      </div>
      <div class="site-header__brand">gogogo</div>
      <div class="site-header__right">
        <button class="auth-btn" type="button" id="btn-auth">Login</button>
      </div>
    </header>
  </div>

  <div class="menu-panel" id="menu-panel" hidden>
    <div class="menu-panel__sheet" role="dialog" aria-label="Menü">
      <nav class="menu-panel__nav">
        <button type="button" data-view="gen">Generator</button>
        <button type="button" data-view="list">Liste</button>
        <button type="button" data-view="qr">QR anzeigen</button>
        <a href="/go/">gogogo.social</a>
      </nav>
    </div>
  </div>

  <div class="wrap">
    <button
      class="cycle-wrap"
      id="cycle-btn"
      type="button"
      aria-label="Zurück zum Formular"
      disabled
    >
      <svg class="cycle is-spinning" id="cycle" viewBox="0 0 240 240" width="240" height="240" aria-hidden="true"></svg>
    </button>
    <button class="admin-name" id="admin-name" type="button" hidden></button>

    <div class="panel" id="panel-login">
      <h1>gogogo lead code generator</h1>
      <form id="login-form" novalidate>
        <label class="visually-hidden" for="login-name">Vorname</label>
        <input class="field" id="login-name" type="text" autocomplete="username" placeholder="Vorname" required />
        <label class="visually-hidden" for="login-code">Code</label>
        <input class="field" id="login-code" type="password" autocomplete="current-password" placeholder="Code" required />
        <button class="btn" type="submit">Los geht's</button>
        <p class="msg" id="login-msg" role="status"></p>
      </form>
    </div>

    <div class="panel" id="panel-gen" hidden>
      <h1>gogogo lead code generator</h1>
      <form id="gen-form" novalidate>
        <label class="visually-hidden" for="gen-name">Vorname</label>
        <input class="field" id="gen-name" type="text" autocomplete="off" placeholder="Vorname" required />

        <label class="visually-hidden" for="gen-serial">Seriennummer</label>
        <div class="field-row">
          <input
            class="field"
            id="gen-serial"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{8}"
            maxlength="8"
            autocomplete="off"
            placeholder="Seriennummer (8 Stellen)"
            required
          />
          <button class="btn-gen" type="button" id="btn-serial" aria-label="Neue 8-stellige Seriennummer">neu</button>
        </div>

        <label class="visually-hidden" for="gen-code">Einladung</label>
        <div class="field-row">
          <input
            class="field"
            id="gen-code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="off"
            placeholder="Code (4 Stellen)"
            required
          />
          <button class="btn-gen" type="button" id="btn-code" aria-label="Neuen 4-stelligen Code">neu</button>
        </div>

        <button class="btn" id="gen-submit" type="submit">generieren</button>
        <p class="msg" id="gen-msg" role="status"></p>
      </form>
    </div>

    <div class="panel" id="panel-list" hidden>
      <h1>Liste</h1>
      <p class="msg" id="list-msg" role="status"></p>
      <div class="list" id="code-list"></div>
    </div>

    <div class="panel" id="panel-result" hidden>
      <p class="result-meta" id="result-meta"></p>
      <div class="qr-box" id="qr-box">
        <div id="qr-mount" aria-hidden="true"></div>
        <a id="qr-link" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = "https://agpysewcsakdpmpftndp.supabase.co";
      var SUPABASE_KEY = "sb_publishable_xd3b3JYejCTc4zXaDmT6Qw_jYaLWCTQ";
      var ADMIN_NAME = "biigJ";
      var ADMIN_CODE = "121276030993";
      var AUTH_KEY = "gogogo_go_admin";
      var ACCOUNT_KEY = "gogogo_go_account";
      var GO_BASE = "https://www.gogogo.social/go";
      var adminNameBtn = document.getElementById("admin-name");

      function drawCycle(svg) {
        var ns = "http://www.w3.org/2000/svg";
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var cx = 120, cy = 120, inner = 78, outer = 112, count = 30;
        for (var s = 0; s < count; s++) {
          var a = ((s / count) * Math.PI * 2) - Math.PI / 2;
          var line = document.createElementNS(ns, "line");
          line.setAttribute("x1", (cx + Math.cos(a) * inner).toFixed(2));
          line.setAttribute("y1", (cy + Math.sin(a) * inner).toFixed(2));
          line.setAttribute("x2", (cx + Math.cos(a) * outer).toFixed(2));
          line.setAttribute("y2", (cy + Math.sin(a) * outer).toFixed(2));
          line.setAttribute("stroke", "#F7F5F0");
          line.setAttribute("stroke-width", "3");
          line.setAttribute("stroke-linecap", "round");
          svg.appendChild(line);
        }
      }
      drawCycle(document.getElementById("cycle"));

      var panelLogin = document.getElementById("panel-login");
      var panelGen = document.getElementById("panel-gen");
      var panelResult = document.getElementById("panel-result");
      var panelList = document.getElementById("panel-list");
      var cycleBtn = document.getElementById("cycle-btn");
      var authBtn = document.getElementById("btn-auth");
      var menuBtn = document.getElementById("btn-menu");
      var menuPanel = document.getElementById("menu-panel");
      var lastQr = null;

      function isAuthed() {
        try { return sessionStorage.getItem(AUTH_KEY) === "1"; } catch (e) { return false; }
      }

      function updateAuthBtn() {
        authBtn.textContent = isAuthed() ? "Logout" : "Login";
      }

      function setMenu(open) {
        menuBtn.classList.toggle("is-open", open);
        menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
        menuPanel.classList.toggle("is-open", open);
        menuPanel.hidden = !open;
        document.body.classList.toggle("menu-open", open);
      }

      function hideAllPanels() {
        panelLogin.hidden = true;
        panelGen.hidden = true;
        panelResult.hidden = true;
        panelList.hidden = true;
      }

      function setCycleBack(on) {
        cycleBtn.classList.toggle("is-back", on);
        cycleBtn.disabled = !on;
        cycleBtn.setAttribute("aria-disabled", on ? "false" : "true");
      }

      function setActorName(name) {
        if (!isAuthed() || !name) {
          adminNameBtn.hidden = true;
          adminNameBtn.textContent = "";
          return;
        }
        adminNameBtn.hidden = false;
        adminNameBtn.textContent = name;
      }

      function namesMatch(a, b) {
        return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
      }

      async function enterUserAccount(name, serial, code) {
        if (!name) return;
        adminNameBtn.disabled = true;
        var account = null;
        try {
          var accRes = await fetch(
            SUPABASE_URL + "/rest/v1/go_accounts?name=ilike." + encodeURIComponent(name) +
            "&select=*&order=created_at.desc&limit=20",
            { headers: apiHeaders() }
          );
          var accounts = accRes.ok ? await accRes.json() : [];
          var matches = (accounts || []).filter(function (row) {
            return namesMatch(row.name, name);
          });
          if (code) {
            for (var i = 0; i < matches.length; i++) {
              if (String(matches[i].invite_code || "") === String(code)) {
                account = matches[i];
                break;
              }
            }
          }
          if (!account) {
            for (var p = 0; p < matches.length; p++) {
              if (matches[p].photo_url) { account = matches[p]; break; }
            }
          }
          if (!account && matches.length) account = matches[0];
        } catch (e) {}

        if (!account) {
          var invite = { serial_number: serial || null, code: code || null };
          try {
            var invRes = await fetch(
              SUPABASE_URL + "/rest/v1/go_invite_codes?first_name=ilike." + encodeURIComponent(name) +
              "&select=*&order=created_at.desc&limit=5",
              { headers: apiHeaders() }
            );
            var invites = invRes.ok ? await invRes.json() : [];
            for (var n = 0; n < (invites || []).length; n++) {
              if (namesMatch(invites[n].first_name, name)) {
                invite = invites[n];
                break;
              }
            }
          } catch (e) {}
          try {
            var created = await fetch(SUPABASE_URL + "/rest/v1/go_accounts", {
              method: "POST",
              headers: apiHeaders({
                "Content-Type": "application/json",
                Prefer: "return=representation"
              }),
              body: JSON.stringify({
                name: name,
                phone: "admin",
                invite_code: invite.code || code || null,
                serial_number: invite.serial_number || serial || null
              })
            });
            if (created.ok) {
              var rows = await created.json();
              account = rows && rows[0] ? rows[0] : null;
            }
          } catch (e) {}
        }

        if (!account) {
          account = {
            id: "local-" + Date.now(),
            name: name,
            phone: "admin",
            invite_code: code || null,
            serial_number: serial || null,
            photo_url: null
          };
        }

        try { localStorage.setItem(ACCOUNT_KEY, JSON.stringify(account)); } catch (e) {}
        window.location.href = "/account/";
      }

      function showGen() {
        hideAllPanels();
        panelGen.hidden = false;
        setCycleBack(false);
        setActorName(ADMIN_NAME);
        fillDefaults();
        updateAuthBtn();
      }
      function showLogin() {
        hideAllPanels();
        panelLogin.hidden = false;
        setCycleBack(false);
        setActorName("");
        try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
        updateAuthBtn();
      }
      function showResult(name, serial, code) {
        var url = GO_BASE;
        hideAllPanels();
        lastQr = { name: name, serial: serial, code: code, url: url };
        panelResult.hidden = false;
        var metaEl = document.getElementById("result-meta");
        metaEl.hidden = !(serial || code);
        metaEl.textContent = serial || code ? (serial + " · " + code) : "";
        document.getElementById("qr-link").href = url;
        document.getElementById("qr-link").textContent = url;
        setCycleBack(true);
        setActorName(name || ADMIN_NAME);
        renderQr(url);
        updateAuthBtn();
      }

      function apiHeaders(extra) {
        var h = {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        };
        Object.keys(extra || {}).forEach(function (k) { h[k] = extra[k]; });
        return h;
      }

      function actionError(text) {
        if (/42703|paused does not exist|PGRST202|function.*(pause_go_invite|delete_go_invite)/i.test(text || "")) {
          return "In Supabase SQL Editor go-invite-admin.sql ausführen.";
        }
        return text || "Aktion fehlgeschlagen.";
      }

      async function callRpc(name, args) {
        return fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
          method: "POST",
          headers: apiHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(args)
        });
      }

      async function pauseInvite(id, paused) {
        var res = await callRpc("pause_go_invite", { p_id: id, p_paused: paused });
        if (res.status === 404) {
          res = await fetch(
            SUPABASE_URL + "/rest/v1/go_invite_codes?id=eq." + encodeURIComponent(id),
            {
              method: "PATCH",
              headers: apiHeaders({
                "Content-Type": "application/json",
                Prefer: "return=minimal"
              }),
              body: JSON.stringify({ paused: paused })
            }
          );
        }
        if (!res.ok) {
          var t = "";
          try { t = await res.text(); } catch (e) {}
          throw new Error(actionError(t));
        }
      }

      async function deleteInvite(id) {
        var res = await callRpc("delete_go_invite", { p_id: id });
        if (res.status === 404) {
          res = await fetch(
            SUPABASE_URL + "/rest/v1/go_invite_codes?id=eq." + encodeURIComponent(id),
            { method: "DELETE", headers: apiHeaders() }
          );
        }
        if (!res.ok) {
          var t = "";
          try { t = await res.text(); } catch (e) {}
          throw new Error(actionError(t));
        }
      }

      function renderListRow(list, row) {
        var wrap = document.createElement("div");
        wrap.className = "list-row" + (row.paused ? " is-paused" : "");

        var openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "list-item";
        var title = document.createElement("strong");
        title.textContent = row.first_name || "";
        var meta = document.createElement("span");
        meta.textContent = (row.serial_number || "") + " · " + (row.code || "") +
          (row.paused ? " · pausiert" : "");
        openBtn.appendChild(title);
        openBtn.appendChild(meta);
        openBtn.addEventListener("click", function () {
          showResult(row.first_name, row.serial_number, row.code);
        });

        var actions = document.createElement("div");
        actions.className = "list-actions";

        var pauseBtn = document.createElement("button");
        pauseBtn.type = "button";
        pauseBtn.className = "list-action" + (row.paused ? " is-on" : "");
        pauseBtn.textContent = row.paused ? "Weiter" : "Pause";
        pauseBtn.setAttribute("aria-pressed", row.paused ? "true" : "false");

        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "list-action";
        delBtn.textContent = "Löschen";

        function setBusy(on) {
          pauseBtn.disabled = on;
          delBtn.disabled = on;
        }

        pauseBtn.addEventListener("click", async function (e) {
          e.stopPropagation();
          setBusy(true);
          try {
            await pauseInvite(row.id, !row.paused);
            row.paused = !row.paused;
            wrap.classList.toggle("is-paused", row.paused);
            pauseBtn.classList.toggle("is-on", row.paused);
            pauseBtn.textContent = row.paused ? "Weiter" : "Pause";
            pauseBtn.setAttribute("aria-pressed", row.paused ? "true" : "false");
            meta.textContent = (row.serial_number || "") + " · " + (row.code || "") +
              (row.paused ? " · pausiert" : "");
            document.getElementById("list-msg").textContent = "";
            document.getElementById("list-msg").classList.remove("is-error");
          } catch (err) {
            document.getElementById("list-msg").textContent = err && err.message ? err.message : "Pause fehlgeschlagen.";
            document.getElementById("list-msg").classList.add("is-error");
          }
          setBusy(false);
        });

        delBtn.addEventListener("click", async function (e) {
          e.stopPropagation();
          if (!window.confirm("Eintrag für " + (row.first_name || "diesen Code") + " löschen?")) return;
          setBusy(true);
          try {
            await deleteInvite(row.id);
            if (lastQr && lastQr.code === row.code) lastQr = null;
            wrap.remove();
            var remaining = list.querySelectorAll(".list-row").length;
            document.getElementById("list-msg").classList.remove("is-error");
            document.getElementById("list-msg").textContent = remaining ? "" : "Noch keine Codes.";
          } catch (err) {
            document.getElementById("list-msg").textContent = err && err.message ? err.message : "Löschen fehlgeschlagen.";
            document.getElementById("list-msg").classList.add("is-error");
            setBusy(false);
          }
        });

        actions.appendChild(pauseBtn);
        actions.appendChild(delBtn);
        wrap.appendChild(openBtn);
        wrap.appendChild(actions);
        list.appendChild(wrap);
      }

      async function showList() {
        hideAllPanels();
        panelList.hidden = false;
        setCycleBack(true);
        var list = document.getElementById("code-list");
        var listMsg = document.getElementById("list-msg");
        list.innerHTML = "";
        listMsg.textContent = "Lade …";
        listMsg.classList.remove("is-error");
        try {
          var res = await fetch(
            SUPABASE_URL + "/rest/v1/go_invite_codes?select=*&order=created_at.desc",
            { headers: apiHeaders() }
          );
          if (!res.ok) throw new Error("HTTP " + res.status);
          var rows = await res.json();
          listMsg.textContent = rows.length ? "" : "Noch keine Codes.";
          rows.forEach(function (row) { renderListRow(list, row); });
        } catch (err) {
          listMsg.textContent = "Liste nicht geladen.";
          listMsg.classList.add("is-error");
        }
        setActorName(ADMIN_NAME);
        updateAuthBtn();
      }

      function showQrMenu() {
        showResult("", "", "");
      }

      function requireAuth(fn) {
        if (!isAuthed()) {
          showLogin();
          return;
        }
        fn();
      }

      menuBtn.addEventListener("click", function () {
        setMenu(!menuPanel.classList.contains("is-open"));
      });
      menuPanel.addEventListener("click", function (e) {
        if (e.target === menuPanel) setMenu(false);
      });
      document.querySelectorAll("[data-view]").forEach(function (el) {
        el.addEventListener("click", function () {
          var view = el.getAttribute("data-view");
          setMenu(false);
          requireAuth(function () {
            if (view === "list") showList();
            else if (view === "qr") showQrMenu();
            else showGen();
          });
        });
      });
      authBtn.addEventListener("click", function () {
        setMenu(false);
        showLogin();
      });
      adminNameBtn.addEventListener("click", function () {
        if (!isAuthed() || adminNameBtn.hidden) return;
        var name = adminNameBtn.textContent.trim();
        var serial = lastQr && namesMatch(lastQr.name, name) ? lastQr.serial : "";
        var code = lastQr && namesMatch(lastQr.name, name) ? lastQr.code : "";
        enterUserAccount(name, serial, code);
      });

      function renderQr(url) {
        var mount = document.getElementById("qr-mount");
        if (typeof renderGoQr === "function") {
          renderGoQr(mount, url || GO_BASE);
          return;
        }
        mount.innerHTML = "";
        mount.textContent = url || GO_BASE;
      }

      function randomDigits(n) {
        var out = "";
        var buf = new Uint32Array(n);
        if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
        else for (var i = 0; i < n; i++) buf[i] = Math.floor(Math.random() * 0xffffffff);
        for (var j = 0; j < n; j++) out += String(buf[j] % 10);
        return out;
      }

      function fillSerial() {
        document.getElementById("gen-serial").value = randomDigits(8);
      }
      function fillCode() {
        document.getElementById("gen-code").value = randomDigits(4);
      }
      function fillDefaults() {
        if (!document.getElementById("gen-serial").value) fillSerial();
        if (!document.getElementById("gen-code").value) fillCode();
      }

      try {
        if (isAuthed()) showGen();
        else showLogin();
      } catch (e) { showLogin(); }
      updateAuthBtn();

      document.getElementById("btn-serial").addEventListener("click", fillSerial);
      document.getElementById("btn-code").addEventListener("click", fillCode);

      cycleBtn.addEventListener("click", function () {
        if (cycleBtn.disabled) return;
        document.getElementById("gen-name").value = "";
        document.getElementById("gen-msg").textContent = "";
        document.getElementById("gen-msg").classList.remove("is-error");
        fillSerial();
        fillCode();
        showGen();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      ["gen-serial", "gen-code"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, id === "gen-serial" ? 8 : 4);
        });
      });

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("login-name").value.trim();
        var code = document.getElementById("login-code").value.trim();
        var msg = document.getElementById("login-msg");
        if (name === ADMIN_NAME && code === ADMIN_CODE) {
          try { sessionStorage.setItem(AUTH_KEY, "1"); } catch (err) {}
          msg.textContent = "";
          showGen();
          updateAuthBtn();
        } else {
          msg.textContent = "Vorname oder Code falsch.";
          msg.classList.add("is-error");
        }
      });

      async function insertCode(payload) {
        var res;
        try {
          res = await fetch(SUPABASE_URL + "/rest/v1/go_invite_codes", {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              Prefer: "return=representation"
            },
            body: JSON.stringify(payload)
          });
        } catch (netErr) {
          var offline = Object.assign({ queued_at: new Date().toISOString(), offline: true }, payload);
          try {
            var q = JSON.parse(localStorage.getItem("gogogo_invite_queue") || "[]");
            q.push(offline);
            localStorage.setItem("gogogo_invite_queue", JSON.stringify(q));
          } catch (e) {}
          var e2 = new Error(
            "Supabase nicht erreichbar. Code lokal geparkt — QR trotzdem nutzbar. " +
            "Bitte Projekt-URL prüfen (aktuell: " + SUPABASE_URL.replace("https://", "") + ")."
          );
          e2.offline = true;
          throw e2;
        }
        if (!res.ok) {
          var t = "";
          try { t = await res.text(); } catch (e) {}
          if (res.status === 404 || /PGRST205|does not exist|relation/i.test(t)) {
            throw new Error("Tabelle go_invite_codes fehlt — go-account.sql in Supabase ausführen.");
          }
          throw new Error(t || ("HTTP " + res.status));
        }
        return res.json();
      }

      document.getElementById("gen-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var name = document.getElementById("gen-name").value.trim();
        var serial = document.getElementById("gen-serial").value.trim();
        var code = document.getElementById("gen-code").value.trim();
        var msg = document.getElementById("gen-msg");
        var btn = document.getElementById("gen-submit");
        msg.classList.remove("is-error");
        if (!name || !serial || !code) {
          msg.textContent = "Bitte alle Felder ausfüllen.";
          msg.classList.add("is-error");
          return;
        }
        if (!/^\d{8}$/.test(serial)) {
          msg.textContent = "Seriennummer braucht genau 8 Ziffern.";
          msg.classList.add("is-error");
          return;
        }
        if (!/^\d{4}$/.test(code)) {
          msg.textContent = "Code braucht genau 4 Ziffern.";
          msg.classList.add("is-error");
          return;
        }
        btn.disabled = true;
        msg.textContent = "Speichere …";
        var warn = "";
        try {
          await insertCode({ first_name: name, serial_number: serial, code: code });
        } catch (err) {
          if (err && err.offline) {
            warn = String(err.message || err);
          } else {
            msg.textContent = "Fehler: " + (err && err.message ? err.message : err);
            msg.classList.add("is-error");
            btn.disabled = false;
            return;
          }
        }
        showResult(name, serial, code);
        if (warn) {
          var note = document.createElement("p");
          note.className = "msg is-error";
          note.style.marginTop = "14px";
          note.style.textAlign = "center";
          note.textContent = warn;
          document.getElementById("panel-result").appendChild(note);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
