<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#C7413B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/go/admin/manifest.webmanifest" />
  <title>gogogo lead code generator</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/go-orient-lock.css" />
  <script src="/assets/go-orient-lock.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/assets/go-qr.js"></script>
  <script src="/assets/go-account-session.js"></script>
  <style>
    :root {
      --red: #C7413B;
      --paper: #F7F5F0;
      --ink: rgba(52, 34, 32, 0.9);
      --ink-on-red: rgba(247, 245, 240, 0.9);
      --btn-ink: rgba(170, 58, 52, 0.9);
      --placeholder: rgba(110, 88, 84, 0.9);
      --display: "Space Grotesk", system-ui, sans-serif;
      --max: 420px;
      --pad: 24px;
      --radius: 2px;
      --chrome-bg: #ececeb;
      --chrome-width: min(100% - 32px, 390px);
      --chrome-radius: 22px;
      --header-h: 52px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scrollbar-gutter: stable;
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
    }
    body {
      font-family: var(--display);
      background: var(--red);
      color: var(--ink-on-red);
      min-height: 100svh;
      width: 100%;
      max-width: 100%;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-x: none;
      -webkit-overflow-scrolling: touch;
    }
    /* Neutral hinter dem Notch — kein roter Rand unter der Statusleiste */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 45;
      height: constant(safe-area-inset-top);
      height: env(safe-area-inset-top, 0px);
      background: var(--chrome-bg);
      pointer-events: none;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: inherit; text-decoration: none; }

    .site-top {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: center;
      padding: calc(14px + constant(safe-area-inset-top)) 16px 0;
      padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0;
      pointer-events: none;
    }
    .site-header {
      pointer-events: auto;
      width: var(--chrome-width);
      display: grid; grid-template-columns: 44px 1fr auto;
      align-items: center; height: var(--header-h);
      padding: 0 8px; background: var(--chrome-bg);
      border-radius: var(--chrome-radius); color: var(--ink);
    }
    .site-header__brand { justify-self: center; font-weight: 600; font-size: 0.92rem; }
    .site-header__left, .site-header__right {
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn {
      width: 40px; height: 40px; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .icon-btn__burger {
      position: relative; width: 18px; height: 12px; display: block;
    }
    .icon-btn__burger i,
    .icon-btn__burger::before,
    .icon-btn__burger::after {
      content: ""; position: absolute; left: 0; width: 18px; height: 1.5px;
      background: var(--ink); border-radius: 1px;
      transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;
    }
    .icon-btn__burger i { top: 5px; display: block; }
    .icon-btn__burger::before { top: 0; }
    .icon-btn__burger::after { top: 10px; }
    .icon-btn.is-open .icon-btn__burger i { opacity: 0; }
    .icon-btn.is-open .icon-btn__burger::before { top: 5px; transform: rotate(45deg); }
    .icon-btn.is-open .icon-btn__burger::after { top: 5px; transform: rotate(-45deg); }
    .auth-btn {
      padding: 0 10px; height: 40px;
      font-weight: 700; font-size: 0.78rem; letter-spacing: -0.02em;
      color: var(--ink);
    }
    .menu-panel {
      position: fixed; inset: 0; z-index: 55; display: none;
      align-items: flex-start; justify-content: center;
      padding: calc(14px + constant(safe-area-inset-top) + var(--header-h) + 10px) 16px 24px;
      padding: calc(14px + env(safe-area-inset-top, 0px) + var(--header-h) + 10px) 16px 24px;
      background: rgba(10, 10, 10, 0.18);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .menu-panel.is-open { display: flex; }
    .menu-panel__sheet {
      width: var(--chrome-width); background: rgba(246, 246, 244, 0.96);
      padding: 28px 22px 26px; border-radius: var(--chrome-radius); color: var(--ink);
    }
    .menu-panel__nav {
      display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
    }
    .menu-panel__nav button,
    .menu-panel__nav a {
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      font-weight: 700; letter-spacing: -0.02em;
    }
    body.menu-open { overflow: hidden; }
    body.menu-open .site-top { z-index: 70; }

    .wrap {
      width: min(100%, var(--max));
      max-width: 100%;
      margin: 0 auto;
      padding: calc(14px + var(--header-h) + 24px + env(safe-area-inset-top)) var(--pad) calc(40px + env(safe-area-inset-bottom));
    }
    .cycle-wrap {
      display: block;
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 28px;
      padding: 0;
    }
    .cycle-wrap[hidden] { display: none !important; }
    .cycle-wrap.is-back {
      cursor: pointer;
      border-radius: 50%;
    }
    .cycle-wrap.is-back:focus-visible {
      outline: 2px solid var(--ink-on-red);
      outline-offset: 4px;
    }
    .cycle { width: 240px; height: 240px; display: block; pointer-events: none; }
    .cycle.is-spinning { animation: spin 120s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .cycle.is-spinning { animation: none; } }
    .cycle-portrait {
      position: absolute;
      inset: 50%;
      width: 132px;
      height: 132px;
      margin: -66px 0 0 -66px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.18);
      pointer-events: none;
      display: none;
    }
    .cycle-wrap.has-photo .cycle-portrait { display: block; }
    .cycle-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .admin-rule {
      border: 0;
      border-top: 1px solid rgba(247, 245, 240, 0.85);
      margin: 22px 0 16px;
      width: 100%;
    }
    .admin-chat {
      display: flex;
      flex-direction: column;
      height: 52vh;
      min-height: 280px;
      max-height: 520px;
      margin: 0;
    }
    .admin-feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0 10px;
      overscroll-behavior: contain;
    }
    .admin-composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: flex-end;
      flex: 0 0 auto;
      margin: 0;
      padding: 8px 0 0;
      border-top: 1px solid rgba(247, 245, 240, 0.35);
    }
    .admin-composer__field {
      width: 100%;
      min-width: 0;
      min-height: 40px;
      max-height: calc(1.35em * 3 + 20px);
      padding: 10px 14px;
      border: 0;
      border-radius: 22px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.01em;
      resize: none;
      overflow-y: auto;
      display: block;
    }
    .admin-composer__field::placeholder {
      color: rgba(52, 34, 32, 0.45);
    }
    .admin-composer__field:focus { outline: none; }
    .admin-composer__send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
      background: var(--paper);
      color: var(--red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .admin-composer__send svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .admin-composer__send:disabled { opacity: 0.45; }
    .admin-post {
      max-width: 86%;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.35;
      color: var(--ink-on-red);
      align-self: flex-start;
      text-align: left;
    }
    .admin-post.is-mine {
      align-self: flex-end;
      text-align: right;
    }
    .admin-post__who {
      font-size: 0.68rem;
      opacity: 0.75;
      margin-bottom: 2px;
    }
    .admin-post__body { margin: 0; word-break: break-word; }
    .admin-post__photo {
      display: block;
      width: min(42vw, 132px);
      max-height: 176px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-top: 4px;
    }
    .admin-post.is-mine .admin-post__photo { margin-left: auto; }
    .admin-plan {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .admin-plan__title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 4px;
      color: var(--ink-on-red);
    }
    .admin-plan__block label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      opacity: 0.85;
      margin-bottom: 6px;
    }
    .admin-plan__block textarea,
    .admin-plan__block input {
      width: 100%;
      min-height: 44px;
      padding: 12px 14px;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      resize: vertical;
    }
    .admin-plan__block textarea {
      min-height: 72px;
      line-height: 1.35;
    }
    .admin-plan__block textarea:focus,
    .admin-plan__block input:focus {
      outline: none;
      border-color: var(--ink);
    }
    .admin-plan__save { margin-top: 6px; }
    .admin-plan__hint {
      margin: 10px 0 0;
      font-size: 0.78rem;
      line-height: 1.35;
      letter-spacing: -0.02em;
      color: rgba(247, 245, 240, 0.72);
    }
    .admin-role__status {
      margin: 0 0 10px;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
      color: rgba(247, 245, 240, 0.9);
    }
    .admin-mantras__list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0 0 14px;
    }
    .admin-mantras__row {
      display: grid;
      gap: 6px;
    }
    .admin-mantras__row label {
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      opacity: 0.85;
    }
    .admin-mantras__row textarea,
    .admin-mantras__row input {
      width: 100%;
      padding: 10px 12px;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: var(--radius);
      font: inherit;
      font-size: 0.95rem;
    }
    .admin-mantras__row textarea {
      min-height: 88px;
      resize: vertical;
      white-space: pre-wrap;
    }
    .admin-mantras__row textarea:focus {
      outline: none;
      border-color: var(--ink);
    }
    h1 {
      font-weight: 700;
      font-size: clamp(28px, 8vw, 36px);
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 28px;
      color: var(--ink-on-red);
    }
    .admin-name {
      display: block;
      width: 100%;
      margin: -4px 0 24px;
      font-weight: 700;
      font-size: clamp(1.5rem, 6vw, 2rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
      color: var(--ink-on-red);
      text-decoration: underline;
      text-underline-offset: 5px;
    }
    .admin-name[hidden] { display: none; }
    .admin-name:disabled { opacity: 0.55; cursor: wait; }
    .admin-open-profile {
      display: block;
      width: 100%;
      margin: 28px 0 0;
    }
    .admin-open-profile[hidden] { display: none; }
    .result-meta {
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      opacity: 0.95;
    }
    .field {
      display: block; width: 100%; margin-bottom: 12px; padding: 14px;
      background: var(--paper); color: var(--ink);
      border: 1px solid transparent; border-radius: var(--radius);
      font-size: 16px; font-weight: 500; letter-spacing: -0.02em;
    }
    .field::placeholder { color: var(--placeholder); }
    .field:focus { outline: none; border-color: var(--ink); }
    .field-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 12px;
      align-items: stretch;
    }
    .field-row .field { margin-bottom: 0; }
    .btn-gen {
      padding: 0 14px;
      background: var(--paper);
      color: var(--btn-ink);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: -0.02em;
      border-radius: var(--radius);
      white-space: nowrap;
    }
    .btn-gen:hover { opacity: 0.92; }
    .hint {
      margin: -4px 0 12px;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      opacity: 0.85;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; height: 56px; background: var(--paper); color: var(--btn-ink);
      font-weight: 700; font-size: 1rem; letter-spacing: -0.03em;
      border-radius: var(--radius);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .msg { min-height: 1.2em; margin-top: 12px; font-size: 0.85rem; font-weight: 500; }
    .msg.is-error { text-decoration: underline; }
    .panel[hidden] { display: none !important; }
    #admin-result-extras[hidden] { display: none !important; }
    .qr-box {
      padding: 0;
      background: transparent;
      text-align: center;
      color: var(--ink-on-red);
    }
    .qr-box #qr-mount {
      width: 220px; height: 220px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .qr-box #qr-mount img,
    .qr-box #qr-mount canvas,
    .qr-box #qr-mount table {
      display: block; width: 220px; height: 220px;
      background: transparent !important;
    }
    .qr-box a { color: var(--ink-on-red); word-break: break-all; font-size: 0.85rem; font-weight: 600; }
    .qr-box a[hidden] { display: none !important; }
    body.is-qr-only {
      overflow: hidden;
      height: 100svh;
      max-height: 100svh;
    }
    body.is-qr-only .wrap {
      box-sizing: border-box;
      height: 100svh;
      max-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    body.is-qr-only .cycle-wrap {
      flex: 0 0 auto;
      margin-bottom: 0;
    }
    body.is-qr-only #panel-result {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
    }
    body.is-qr-only .qr-box {
      flex: 0 0 auto;
      width: 100%;
    }
    body.is-qr-only .result-meta,
    body.is-qr-only .admin-open-profile,
    body.is-qr-only #admin-result-extras {
      display: none !important;
    }
    .list {
      display: flex; flex-direction: column; gap: 10px;
    }
    .list-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: stretch;
    }
    .list-item {
      width: 100%; text-align: left;
      background: var(--paper); color: var(--ink);
      border-radius: var(--radius); padding: 14px 16px;
    }
    .list-item strong {
      display: block; font-size: 1.05rem; letter-spacing: -0.03em;
    }
    .list-item span {
      display: block; margin-top: 4px; font-size: 0.85rem; font-weight: 500; opacity: 0.8;
    }
    .list-row.is-paused .list-item { opacity: 0.55; }
    .list-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 88px;
    }
    .list-action {
      flex: 1;
      min-height: 36px;
      background: var(--paper);
      color: var(--btn-ink);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: -0.02em;
      border-radius: var(--radius);
      padding: 0 8px;
    }
    .list-action:hover { opacity: 0.92; }
    .list-action:disabled { opacity: 0.45; cursor: wait; }
    .list-action.is-on {
      background: var(--ink);
      color: var(--paper);
    }
    .empty {
      text-align: center; font-weight: 500; opacity: 0.9;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>
  <div class="site-top">
    <header class="site-header">
      <div class="site-header__left">
        <button class="icon-btn" id="btn-menu" type="button" aria-label="Menü" aria-expanded="false">
          <span class="icon-btn__burger"><i></i></span>
        </button>
      </div>
      <div class="site-header__brand">gogogo</div>
      <div class="site-header__right">
        <button class="auth-btn" type="button" id="btn-auth">Login</button>
      </div>
    </header>
  </div>

  <div class="menu-panel" id="menu-panel" hidden>
    <div class="menu-panel__sheet" role="dialog" aria-label="Menü">
      <nav class="menu-panel__nav">
        <button type="button" data-view="gen">Generator</button>
        <button type="button" data-view="list">Alle Nutzer</button>
        <button type="button" data-view="mantras">Mantras</button>
        <button type="button" data-view="qr">QR anzeigen</button>
        <a href="/go/">gogogo.social</a>
      </nav>
    </div>
  </div>

  <div class="wrap">
    <button
      class="cycle-wrap"
      id="cycle-btn"
      type="button"
      aria-label="Zurück zum Generator"
      disabled
    >
      <svg class="cycle is-spinning" id="cycle" viewBox="0 0 240 240" width="240" height="240" aria-hidden="true"></svg>
      <span class="cycle-portrait" id="cycle-portrait" aria-hidden="true">
        <img id="cycle-portrait-img" alt="" />
      </span>
    </button>
    <button class="admin-name" id="admin-name" type="button" hidden></button>

    <div class="panel" id="panel-login">
      <h1>gogogo lead code generator</h1>
      <form id="login-form" novalidate>
        <label class="visually-hidden" for="login-name">Vorname</label>
        <input class="field" id="login-name" type="text" autocomplete="username" placeholder="Vorname" required />
        <label class="visually-hidden" for="login-code">Code</label>
        <input class="field" id="login-code" type="password" autocomplete="current-password" placeholder="Code" required />
        <button class="btn" type="submit">Los geht's</button>
        <p class="msg" id="login-msg" role="status"></p>
      </form>
    </div>

    <div class="panel" id="panel-gen" hidden>
      <h1>gogogo lead code generator</h1>
      <form id="gen-form" novalidate>
        <label class="visually-hidden" for="gen-name">Vorname</label>
        <input class="field" id="gen-name" type="text" autocomplete="off" placeholder="Vorname" required />

        <label class="visually-hidden" for="gen-serial">Seriennummer</label>
        <div class="field-row">
          <input
            class="field"
            id="gen-serial"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{8}"
            maxlength="8"
            autocomplete="off"
            placeholder="Seriennummer (8 Stellen)"
            required
          />
          <button class="btn-gen" type="button" id="btn-serial" aria-label="Neue 8-stellige Seriennummer">neu</button>
        </div>

        <label class="visually-hidden" for="gen-code">Einladung</label>
        <div class="field-row">
          <input
            class="field"
            id="gen-code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            autocomplete="off"
            placeholder="Code (4 Stellen)"
            required
          />
          <button class="btn-gen" type="button" id="btn-code" aria-label="Neuen 4-stelligen Code">neu</button>
        </div>

        <button class="btn" id="gen-submit" type="submit">generieren</button>
        <p class="msg" id="gen-msg" role="status"></p>
      </form>
    </div>

    <div class="panel" id="panel-list" hidden>
      <h1>Alle Nutzer</h1>
      <p class="msg" id="list-msg" role="status"></p>
      <div class="list" id="code-list"></div>
    </div>

    <div class="panel" id="panel-mantras" hidden>
      <h1>Mantras</h1>
      <div class="admin-mantras__list" id="mantra-list"></div>
      <button class="btn" type="button" id="mantra-save">Mantras speichern</button>
      <p class="msg" id="mantra-msg" role="status"></p>
    </div>

      function drawCycle(svg) {
        var ns = "http://www.w3.org/2000/svg";
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var cx = 120, cy = 120, inner = 78, outer = 112, count = 30;
        for (var s = 0; s < count; s++) {
          var a = ((s / count) * Math.PI * 2) - Math.PI / 2;
          var line = document.createElementNS(ns, "line");
          line.setAttribute("x1", (cx + Math.cos(a) * inner).toFixed(2));
          line.setAttribute("y1", (cy + Math.sin(a) * inner).toFixed(2));
          line.setAttribute("x2", (cx + Math.cos(a) * outer).toFixed(2));
          line.setAttribute("y2", (cy + Math.sin(a) * outer).toFixed(2));
          line.setAttribute("stroke", "#F7F5F0");
          line.setAttribute("stroke-width", "3");
          line.setAttribute("stroke-linecap", "round");
          svg.appendChild(line);
        }
      }

      async function resolveRelatedAccounts(name, serial, code) {
        var seen = {};
        var list = [];
        function addRows(rows, requireName) {
          if (!rows) return;
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            if (!row || !row.id || seen[row.id]) continue;
            if (requireName && name && !namesMatch(row.name, name)) continue;
            seen[row.id] = true;
            list.push(row);
          }
        }
        try {
          if (serial) {
            var bySerial = await fetch(
              SUPABASE_URL + "/rest/v1/go_accounts?serial_number=eq." + encodeURIComponent(serial) +
              "&select=*&order=created_at.desc&limit=50",
              { headers: apiHeaders() }
            );
            addRows(bySerial.ok ? await bySerial.json() : [], false);
          }
          if (name) {
            var accRes = await fetch(
              SUPABASE_URL + "/rest/v1/go_accounts?name=ilike." + encodeURIComponent(name) +
              "&select=*&order=created_at.desc&limit=50",
              { headers: apiHeaders() }
            );
            addRows(accRes.ok ? await accRes.json() : [], true);
          }
          if (code) {
            var byCode = await fetch(
              SUPABASE_URL + "/rest/v1/go_accounts?invite_code=eq." + encodeURIComponent(code) +
              "&select=*&order=created_at.desc&limit=50",
              { headers: apiHeaders() }
            );
            addRows(byCode.ok ? await byCode.json() : [], name ? true : false);
          }
        } catch (e) {}
        return list;
      }

      async function pickPrimaryAccount(accounts) {
        if (!accounts || !accounts.length) return null;
        var best = accounts[0];
        var bestCount = -1;
        for (var i = 0; i < accounts.length; i++) {
          var acc = accounts[i];
          var count = 0;
          try {
            var res = await fetch(
              SUPABASE_URL + "/rest/v1/go_community_posts?author_id=eq." + encodeURIComponent(acc.id) +
              "&select=id&limit=50",
              { headers: apiHeaders() }
            );
            var rows = res.ok ? await res.json() : [];
            count = rows ? rows.length : 0;
          } catch (e) {}
          if (count > bestCount) {
            bestCount = count;
            best = acc;
          } else if (count === bestCount && acc.photo_url && !best.photo_url) {
            best = acc;
          }
        }
        return best;
      }

          activeAccountIds = [];
          return null;
        }
        return await pickPrimaryAccount(related);

      async function dayHistoryExists(accountId, dayKey) {
        if (!(await probeCoachHistoryTable())) return false;

        if (!res.ok) return false;

        return !!(rows && rows.length);

      async function insertDayHistory(rows) {
        if (!rows || !rows.length) return { ok: true, missing: false };
        if (!(await probeCoachHistoryTable())) return { ok: true, missing: true };
        var res = await fetch(SUPABASE_URL + "/rest/v1/go_coach_plan_day_history", {
          method: "POST",
          headers: apiHeaders({
            "Content-Type": "application/json",
            Prefer: "return=minimal"
          }),
          body: JSON.stringify(rows)
        });
        if (res.ok) return { ok: true, missing: false };
        var t = "";
        try { t = await res.text(); } catch (e0) {}
        if (res.status === 404 || /PGRST205|go_coach_plan_day_history|schema cache/i.test(t)) {
          coachHistoryAvailable = false;
          return { ok: true, missing: true };
        }
        return { ok: false, missing: false, detail: t || ("HTTP " + res.status) };
      }

      /* Bei Überschreiben: alten Stand archivieren (immutable), neuer gilt ab heute. */
      async function archiveChangedDays(accountId, previous, payload) {
        if (!(await probeCoachHistoryTable())) {
          return { ok: true, missing: true };
        }
        var today = berlinTodayISO();
        var inserts = [];
        for (var i = 0; i < DAY_PLAN_KEYS.length; i++) {
          var key = DAY_PLAN_KEYS[i];
          var oldVal = previous ? normPlanText(previous[key]) : null;
          var newVal = normPlanText(payload[key]);
          if (oldVal === newVal) continue;
          var hasHist = await dayHistoryExists(accountId, key);
          if (!hasHist && oldVal != null) {
            inserts.push({
              account_id: accountId,
              day_key: key,
              body: oldVal,
              effective_from: "2000-01-01"
            });
          }
          inserts.push({
            account_id: accountId,
            day_key: key,
            body: newVal,
            effective_from: today
          });
        }
        if (!inserts.length) return { ok: true, missing: false };
        return await insertDayHistory(inserts);
      }

        if (!activeAccount || !activeAccount.id || String(activeAccount.id).indexOf("local-") === 0) {

            { headers: apiHeaders() }

        } catch (e0) {}
        var names = ["Joscha", ADMIN_NAME];

            var rows = res.ok ? await res.json() : [];
            for (var j = 0; j < (rows || []).length; j++) {
              if (namesMatch(rows[j].name, names[i])) {
                if (apply(rows[j])) return coachAccount;
              }
            }
          } catch (e) {}
        }
        try {
          var created = await fetch(SUPABASE_URL + "/rest/v1/go_accounts", {

      function formatMantraField(row) {
        if (!row) return "";
        var body = row.body != null ? String(row.body).trim() : "";
        var who = row.attribution != null ? String(row.attribution).trim() : "";
        if (!who && body) {
          var legacy = body.match(/^(.*)\s+[—–-]\s+(.+)$/);
          if (legacy) {
            body = String(legacy[1] || "").trim();
            who = String(legacy[2] || "").trim();
          }
        }
        if (!body) return who;
        return who ? (body + "\n" + who) : body;
      }

      function parseMantraField(raw) {
        var lines = String(raw || "").replace(/\r\n/g, "\n").split("\n");
        while (lines.length && !String(lines[lines.length - 1] || "").trim()) lines.pop();
        while (lines.length && !String(lines[0] || "").trim()) lines.shift();
        if (!lines.length) return { body: "", attribution: null };
        if (lines.length === 1) {
          var one = String(lines[0]).trim();
          // Legacy: "Satz — Person" in einer Zeile → getrennt speichern
          var legacy = one.match(/^(.*)\s+[—–-]\s+(.+)$/);
          if (legacy) {
            return {
              body: String(legacy[1] || "").trim().slice(0, 220),
              attribution: String(legacy[2] || "").trim().slice(0, 80) || null
            };
          }
          return { body: one.slice(0, 220), attribution: null };
        }
        var who = String(lines[lines.length - 1]).trim().slice(0, 80);
        var body = lines.slice(0, -1).join("\n").trim().slice(0, 220);
        return { body: body, attribution: who || null };
      }

      function renderMantraEditor(rows) {
        var list = document.getElementById("mantra-list");
        if (!list) return;
        list.innerHTML = "";
        var bySlot = {};
        (rows || []).forEach(function (row) {
          if (row && row.slot) bySlot[Number(row.slot)] = row;
        });
        for (var slot = 1; slot <= 20; slot++) {
          var src = bySlot[slot] || DEFAULT_MANTRAS[slot - 1] || { body: "", attribution: "" };
          var rowEl = document.createElement("div");
          rowEl.className = "admin-mantras__row";
          rowEl.dataset.slot = String(slot);
          var bodyLabel = document.createElement("label");
          bodyLabel.setAttribute("for", "mantra-body-" + slot);
          bodyLabel.textContent = "Mantra " + slot;
          var body = document.createElement("textarea");
          body.id = "mantra-body-" + slot;
          body.maxLength = 320;
          body.rows = 3;
          body.placeholder = "Satz\nMensch";
          body.value = formatMantraField(src);
          rowEl.appendChild(bodyLabel);
          rowEl.appendChild(body);
          list.appendChild(rowEl);
        }
      }

      async function showMantras() {
        hideAllPanels();
        if (panelMantras) panelMantras.hidden = false;
        activeAccount = null;
        activeAccountIds = [];
        setCycleVisible(false);
        setCyclePhoto(null);
        setCycleBack(false);
        setActorName("");
        var msg = document.getElementById("mantra-msg");
        if (msg) {
          msg.textContent = "Lade …";
          msg.classList.remove("is-error");
        }
        var rows = null;
        try {
          var res = await fetch(
            SUPABASE_URL + "/rest/v1/go_mantras?select=slot,body,attribution&order=slot.asc&limit=20",
            { headers: apiHeaders() }
          );
          if (res.ok) rows = await res.json();
        } catch (e) {}
        renderMantraEditor(rows && rows.length ? rows : DEFAULT_MANTRAS);
        if (msg) {
          if (rows && rows.length) msg.textContent = "";
          else msg.textContent = "Defaults geladen. Speichern schreibt nach Supabase (go-mantras.sql?).";
        }
        updateAuthBtn();
      }

      async function saveMantras() {
        var msg = document.getElementById("mantra-msg");
        var list = document.getElementById("mantra-list");
        if (!list) return;
        var payload = [];
        var rows = list.querySelectorAll(".admin-mantras__row");
        for (var i = 0; i < rows.length; i++) {
          var slot = Number(rows[i].dataset.slot);
          var bodyEl = document.getElementById("mantra-body-" + slot);
          var parsed = parseMantraField(bodyEl ? bodyEl.value : "");
          if (!parsed.body) {
            if (msg) {
              msg.textContent = "Mantra " + slot + " braucht mindestens den Satz.";
              msg.classList.add("is-error");
            }
            return;
          }
          payload.push({
            slot: slot,
            body: parsed.body,
            attribution: parsed.attribution,
            updated_at: new Date().toISOString()
          });
        }
        if (msg) {
          msg.classList.remove("is-error");
          msg.textContent = "Speichere …";
        }
        try {
          var res = await fetch(SUPABASE_URL + "/rest/v1/go_mantras?on_conflict=slot", {
            method: "POST",
            headers: apiHeaders({
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=minimal"
            }),
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            if (msg) {
              msg.textContent = "Speichern fehlgeschlagen (go-mantras.sql ausführen?).";
              msg.classList.add("is-error");
            }
            return;
          }
          if (msg) msg.textContent = "Gespeichert.";
        } catch (e) {
          if (msg) {
            msg.textContent = "Speichern fehlgeschlagen.";
            msg.classList.add("is-error");
          }
        }
      }

      function requireAuth(fn) {
        if (!isAuthed()) {
          showLogin();
          return;
        }
        fn();
      }

      menuBtn.addEventListener("click", function () {
        setMenu(!menuPanel.classList.contains("is-open"));
      });
      menuPanel.addEventListener("click", function (e) {
        if (e.target === menuPanel) setMenu(false);
      });
      document.querySelectorAll("[data-view]").forEach(function (el) {
        el.addEventListener("click", function () {
          var view = el.getAttribute("data-view");
          setMenu(false);
          requireAuth(function () {
            if (view === "list") showList();
            else if (view === "mantras") showMantras();
            else if (view === "qr") showQrMenu();
            else showGen();
          });
        });
      });
      authBtn.addEventListener("click", function () {
        setMenu(false);
        showLogin();
      });
      adminNameBtn.addEventListener("click", function () {
        openCurrentUserProfile();
      });
      if (adminOpenProfileBtn) {
        adminOpenProfileBtn.addEventListener("click", function () {
          openCurrentUserProfile();
        });
      }

      function renderQr(url) {
        var mount = document.getElementById("qr-mount");
        if (typeof renderGoQr === "function") {
          renderGoQr(mount, url || GO_BASE);
          return;
        }
        mount.innerHTML = "";
        mount.textContent = url || GO_BASE;
      }

      function randomDigits(n) {
        var out = "";
        var buf = new Uint32Array(n);
        if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(buf);
        else for (var i = 0; i < n; i++) buf[i] = Math.floor(Math.random() * 0xffffffff);
        for (var j = 0; j < n; j++) out += String(buf[j] % 10);
        return out;
      }

      function fillSerial() {
        document.getElementById("gen-serial").value = randomDigits(8);
      }
      function fillCode() {
        document.getElementById("gen-code").value = randomDigits(4);
      }
      function fillDefaults() {
        if (!document.getElementById("gen-serial").value) fillSerial();
        if (!document.getElementById("gen-code").value) fillCode();
      }

      try {
        if (isAuthed()) showGen();
        else showLogin();
      } catch (e) { showLogin(); }
      updateAuthBtn();

      document.getElementById("btn-serial").addEventListener("click", fillSerial);
      document.getElementById("btn-code").addEventListener("click", fillCode);

      cycleBtn.addEventListener("click", function () {
        if (cycleBtn.disabled) return;
        document.getElementById("gen-name").value = "";
        document.getElementById("gen-msg").textContent = "";
        document.getElementById("gen-msg").classList.remove("is-error");
        fillSerial();
        fillCode();
        showGen();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      var planSave = document.getElementById("plan-save");
      if (planSave) planSave.addEventListener("click", function () { saveCoachPlan(); });

      var mantraSave = document.getElementById("mantra-save");
      if (mantraSave) mantraSave.addEventListener("click", function () { saveMantras(); });

      var trainerToggle = document.getElementById("trainer-toggle");
      if (trainerToggle) {
        trainerToggle.addEventListener("click", function () {
          var next = !(activeAccount && activeAccount.is_trainer);
          setTrainerRole(next);
        });
      }
      refreshTrainerUi();

      (function bindAdminComposer() {
        var composer = document.getElementById("admin-composer");
        var replyText = document.getElementById("admin-reply-text");
        var replySend = document.getElementById("admin-reply-send");
        if (replyText) {
          replyText.addEventListener("input", function () {
            var v = String(replyText.value || "");
            if (v.length > 144) replyText.value = v.slice(0, 144);
            resizeAdminReplyField();
            if (replySend) replySend.disabled = !String(replyText.value || "").trim();
          });
          resizeAdminReplyField();
        }
        if (composer) {
          composer.addEventListener("submit", function (ev) {
            ev.preventDefault();
            sendAdminReply();
          });
        }
      })();

      ["gen-serial", "gen-code"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, id === "gen-serial" ? 8 : 4);
        });
      });

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("login-name").value.trim();
        var code = document.getElementById("login-code").value.trim();
        var msg = document.getElementById("login-msg");
        if (name === ADMIN_NAME && code === ADMIN_CODE) {
          setAuthed(true);
          msg.textContent = "";
          showGen();
          updateAuthBtn();
        } else {
          msg.textContent = "Vorname oder Code falsch.";
          msg.classList.add("is-error");
        }
      });

      async function insertCode(payload) {
        var res;
        try {
          res = await fetch(SUPABASE_URL + "/rest/v1/go_invite_codes", {
            method: "POST",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: "Bearer " + SUPABASE_KEY,
              "Content-Type": "application/json",
              Prefer: "return=representation"
            },
            body: JSON.stringify(payload)
          });
        } catch (netErr) {
          var offline = Object.assign({ queued_at: new Date().toISOString(), offline: true }, payload);
          try {
            var q = JSON.parse(localStorage.getItem("gogogo_invite_queue") || "[]");
            q.push(offline);
            localStorage.setItem("gogogo_invite_queue", JSON.stringify(q));
          } catch (e) {}
          var e2 = new Error(
            "Supabase nicht erreichbar. Code lokal geparkt — QR trotzdem nutzbar. " +
            "Bitte Projekt-URL prüfen (aktuell: " + SUPABASE_URL.replace("https://", "") + ")."
          );
          e2.offline = true;
          throw e2;
        }
        if (!res.ok) {
          var t = "";
          try { t = await res.text(); } catch (e) {}
          if (res.status === 404 || /PGRST205|does not exist|relation/i.test(t)) {
            throw new Error("Tabelle go_invite_codes fehlt — go-account.sql in Supabase ausführen.");
          }
          throw new Error(t || ("HTTP " + res.status));
        }
        return res.json();
      }

      document.getElementById("gen-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var name = document.getElementById("gen-name").value.trim();
        var serial = document.getElementById("gen-serial").value.trim();
        var code = document.getElementById("gen-code").value.trim();
        var msg = document.getElementById("gen-msg");
        var btn = document.getElementById("gen-submit");
        msg.classList.remove("is-error");
        if (!name || !serial || !code) {
          msg.textContent = "Bitte alle Felder ausfüllen.";
          msg.classList.add("is-error");
          return;
        }
        if (!/^\d{8}$/.test(serial)) {
          msg.textContent = "Seriennummer braucht genau 8 Ziffern.";
          msg.classList.add("is-error");
          return;
        }
        if (!/^\d{4}$/.test(code)) {
          msg.textContent = "Code braucht genau 4 Ziffern.";
          msg.classList.add("is-error");
          return;
        }
        btn.disabled = true;
        msg.textContent = "Speichere …";
        var warn = "";
        try {
          await insertCode({ first_name: name, serial_number: serial, code: code });
        } catch (err) {
          if (err && err.offline) {
            warn = String(err.message || err);
          } else {
            msg.textContent = "Fehler: " + (err && err.message ? err.message : err);
            msg.classList.add("is-error");
            btn.disabled = false;
            return;
          }
        }
        showResult(name, serial, code);
        if (warn) {
          var note = document.createElement("p");
          note.className = "msg is-error";
          note.style.marginTop = "14px";
          note.style.textAlign = "center";
          note.textContent = warn;
          document.getElementById("panel-result").appendChild(note);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
        btn.disabled = false;
      });
    })();
  </script>
