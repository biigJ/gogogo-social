<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gogogo</title>
  <meta name="description" content="Challenge Deinen Bewegungsmangel." />
  <link rel="canonical" href="https://www.gogogo.social/go/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      var next = "/go/" + (location.search || "") + (location.hash || "");
      try {
        var a = JSON.parse(localStorage.getItem("gogogo_go_account") || "null");
        if (a && a.name) next = "/account/";
      } catch (e) {}
      location.replace(next);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/go/" /></noscript>
</head>
<body>
  <p><a href="/go/">Weiter zu gogogo</a></p>
</body>
</html>
