<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#C7413B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Natalya" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>gogogo · Natalya</title>
  <link rel="manifest" href="/natalyaalice/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #C7413B;
      --ink: #F7F5F0;
      --dim: rgba(247, 245, 240, 0.78);
      --faint: rgba(247, 245, 240, 0.55);
      --line: rgba(247, 245, 240, 0.28);
      --panel: rgba(247, 245, 240, 0.10);
      --panel-2: rgba(247, 245, 240, 0.18);
      --display: "Space Grotesk", system-ui, sans-serif;
      --body: "Inter", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    main {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom));
    }
    .brand {
      font-family: var(--display);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 13px;
      text-transform: lowercase;
    }
    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 42px;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-top: 6px;
    }
    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }
    .date-row label {
      font-family: var(--display);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .date-row input {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--display);
      font-weight: 600;
      font-size: 16px;
      padding: 8px 0;
      color-scheme: dark;
      min-height: 44px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      min-height: 1.3em;
      font-size: 13px;
      color: var(--dim);
    }
    .meta .err { color: #fff; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 16px 0 8px;
    }
    .tabs button {
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--dim);
      font-family: var(--display);
      font-weight: 600;
      font-size: 15px;
    }
    .tabs button.is-active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .group {
      font-family: var(--display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 22px 0 4px;
    }
    .group-hint {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.35;
      margin: 0 0 10px;
    }
    .item {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 8px;
    }
    .item.is-done { background: var(--panel-2); }
    .check-btn {
      width: 100%;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      text-align: left;
      min-height: 44px;
    }
    .mark {
      width: 28px;
      height: 28px;
      margin-top: 1px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      display: grid;
      place-items: center;
      flex: none;
    }
    .mark svg { opacity: 0; }
    .is-done .mark { background: var(--ink); }
    .is-done .mark svg { opacity: 1; }
    .name {
      display: block;
      font-family: var(--display);
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .cue, .note {
      display: block;
      color: var(--dim);
      font-weight: 400;
      font-size: 13px;
      line-height: 1.35;
      margin-top: 3px;
    }
    .stat {
      color: var(--dim);
      font-size: 13px;
      margin-top: 4px;
      min-height: 1.15em;
    }
    .check-copy { flex: 1; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
    }
    .reps, .kg {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.12);
      border-radius: 12px;
      padding: 4px;
      min-height: 48px;
    }
    .reps input, .kg input {
      width: 64px;
      background: transparent;
      border: 0;
      text-align: center;
      font-family: var(--display);
      font-weight: 700;
      font-size: 20px;
      padding: 6px 0;
    }
    .kg input { width: 76px; }
    .kg input.is-suggestion { color: var(--dim); }
    .unit { color: var(--dim); font-size: 13px; padding-right: 8px; }
    .step {
      width: 44px;
      height: 40px;
      border-radius: 10px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 22px;
      line-height: 1;
    }
    .step.minus { color: var(--ink); }
    .step.plus { background: var(--ink); color: var(--bg); }
    .hint { color: var(--dim); font-size: 13px; margin: 8px 0 12px; }
    .table-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    th, td {
      padding: 10px 12px;
      white-space: nowrap;
      font-size: 13px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    th {
      font-family: var(--display);
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--dim);
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      text-align: left;
      background: #c7413b;
      z-index: 1;
      box-shadow: 8px 0 12px -12px rgba(0, 0, 0, 0.45);
    }
    tbody td:first-child button {
      font-family: var(--display);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      min-height: 32px;
    }
    tfoot td { font-family: var(--display); font-weight: 700; }
    .empty { color: var(--dim); padding: 8px 0 16px; }
    .banner {
      background: #1a1a1a;
      color: var(--ink);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">gogogo</p>
    <h1>Natalya</h1>

    <div class="date-row">
      <label for="date">Datum</label>
      <input id="date" type="date" />
    </div>
    <div class="meta">
      <p id="progress"></p>
      <p id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="tabs" role="tablist" aria-label="Ansicht">
      <button type="button" id="tab-workout" class="is-active" role="tab" aria-selected="true" aria-controls="panel-workout">Workout</button>
      <button type="button" id="tab-history" role="tab" aria-selected="false" aria-controls="panel-history">Verlauf</button>
    </div>

    <section id="panel-workout" role="tabpanel" aria-labelledby="tab-workout">
      <div id="list"></div>
    </section>

    <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
      <p class="hint">Tippe ein Datum, um das Workout zu öffnen. Wischen zeigt alle Übungen.</p>
      <div id="history"></div>
    </section>

    <p class="banner" id="banner" hidden></p>
  </main>

  <script src="/natalyaalice/log.js"></script>
  <script>
    (function () {
      var Log = window.NatalyaLog;
      var SUPABASE_URL = "https://agpysewcsakdpmpftndp.supabase.co";
      var SUPABASE_KEY = "sb_publishable_xd3b3JYejCTc4zXaDmT6Qw_jYaLWCTQ";
      var host = location.hostname;
      // Live site uses the gogogo Supabase project. A local preview posts to the same origin.
      var apiBase = (host === "localhost" || host === "127.0.0.1") ? location.origin : SUPABASE_URL;

      var serverLogs = [];
      var date = Log.berlinToday();
      var draft = Log.draftFromLogs([], date);
      var generation = 0;
      var timers = {};
      var tail = Promise.resolve();

      var dateInput = document.getElementById("date");
      var listEl = document.getElementById("list");
      var historyEl = document.getElementById("history");
      var progressEl = document.getElementById("progress");
      var statusEl = document.getElementById("status");
      var bannerEl = document.getElementById("banner");
      var workoutTab = document.getElementById("tab-workout");
      var historyTab = document.getElementById("tab-history");
      var workoutPanel = document.getElementById("panel-workout");
      var historyPanel = document.getElementById("panel-history");

      dateInput.value = date;

      function rest(path, opts) {
        var headers = {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json"
        };
        if (opts && opts.prefer) headers.Prefer = opts.prefer;
        return fetch(apiBase + "/rest/v1/" + path, {
          method: (opts && opts.method) || "GET",
          headers: headers,
          body: opts && opts.body != null ? JSON.stringify(opts.body) : undefined,
          cache: "no-store"
        }).then(function (res) {
          return res.text().then(function (text) {
            if (!res.ok) throw new Error(text || res.statusText);
            if (!text) return null;
            return JSON.parse(text);
          });
        });
      }

      function explainError(err) {
        var msg = String((err && err.message) || err || "");
        if (/PGRST205|schema cache|does not exist|Could not find the table/i.test(msg)) {
          return "Die Tabelle fehlt noch. Einmal go-natalya-logs.sql im Supabase SQL Editor ausführen.";
        }
        if (/Failed to fetch|NetworkError|Load failed|name not resolved/i.test(msg)) {
          return "Supabase ist gerade nicht erreichbar.";
        }
        return "Speichern fehlgeschlagen.";
      }

      function showBanner(text) {
        if (!text) {
          bannerEl.hidden = true;
          bannerEl.textContent = "";
          return;
        }
        bannerEl.hidden = false;
        bannerEl.textContent = text;
      }

      function setStatus(text, isError) {
        statusEl.textContent = text || "";
        statusEl.classList.toggle("err", !!isError);
      }

      function viewLogs() {
        return Log.projectLogs(serverLogs, date, draft);
      }

      function shownKg(ex) {
        var d = draft[ex.id];
        if (d.kgTouched) return d.kg;
        return Log.suggestionKg(serverLogs, ex.id, date);
      }

      function paintMeta() {
        var logs = viewLogs();
        var n = Log.doneCount(logs, date);
        progressEl.textContent = n + " von " + Log.EXERCISES.length;
        Log.EXERCISES.forEach(function (ex) {
          var stat = document.querySelector('[data-stat="' + ex.id + '"]');
          if (stat) stat.textContent = Log.statLine(ex, Log.statsFor(logs, ex));
          var item = document.querySelector('[data-item="' + ex.id + '"]');
          if (!item) return;
          var row = Log.rowOn(logs, date, ex.id);
          item.classList.toggle("is-done", !!row);
          if (ex.kind === "check") {
            var btn = item.querySelector("[data-check]");
            if (btn) btn.setAttribute("aria-pressed", row && row.done ? "true" : "false");
          }
          if (ex.weight) {
            var input = item.querySelector("[data-kg]");
            var hint = item.querySelector("[data-kghint]");
            var source = draft[ex.id].kgTouched ? "" : Log.weightSource(serverLogs, ex.id, date);
            if (input && document.activeElement !== input) {
              var kg = shownKg(ex);
              input.value = kg == null ? "" : Log.formatNumber(kg);
              input.classList.toggle("is-suggestion", !!source && kg != null);
            }
            if (hint) hint.textContent = source === "last" ? "zuletzt" : "";
          }
        });
        renderHistory();
      }

      function fillCopy(parent, ex) {
        var nameEl = document.createElement("span");
        nameEl.className = "name";
        nameEl.textContent = ex.name;
        parent.appendChild(nameEl);
        if (ex.cue) {
          var cue = document.createElement("span");
          cue.className = "cue";
          cue.textContent = ex.cue;
          parent.appendChild(cue);
        }
        if (ex.note) {
          var note = document.createElement("span");
          note.className = "note";
          note.textContent = ex.note;
          parent.appendChild(note);
        }
      }

      function renderList() {
        listEl.textContent = "";
        var group = "";
        Log.EXERCISES.forEach(function (ex) {
          if (ex.group !== group) {
            group = ex.group;
            var heading = document.createElement("h2");
            heading.className = "group";
            heading.textContent = group;
            listEl.appendChild(heading);
            var blurb = Log.groupHint(group);
            if (blurb) {
              var blurbEl = document.createElement("p");
              blurbEl.className = "group-hint";
              blurbEl.textContent = blurb;
              listEl.appendChild(blurbEl);
            }
          }
          var item = document.createElement("article");
          item.className = "item";
          item.dataset.item = ex.id;

          if (ex.kind === "check") {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "check-btn";
            btn.dataset.check = ex.id;
            btn.setAttribute("aria-pressed", "false");
            var mark = document.createElement("span");
            mark.className = "mark";
            mark.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7.2 5.2 10.5 12 3.5" fill="none" stroke="#C7413B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            var copy = document.createElement("div");
            copy.className = "check-copy";
            fillCopy(copy, ex);
            var stat = document.createElement("p");
            stat.className = "stat";
            stat.dataset.stat = ex.id;
            copy.appendChild(stat);
            btn.appendChild(mark);
            btn.appendChild(copy);
            item.appendChild(btn);
          } else {
            fillCopy(item, ex);
            var statEl = document.createElement("p");
            statEl.className = "stat";
            statEl.dataset.stat = ex.id;
            var controls = document.createElement("div");
            controls.className = "controls";

            var reps = document.createElement("label");
            reps.className = "reps";
            var repsInput = document.createElement("input");
            repsInput.dataset.reps = ex.id;
            repsInput.inputMode = "numeric";
            repsInput.autocomplete = "off";
            repsInput.setAttribute("aria-label", ex.name + " Wiederholungen");
            repsInput.value = draft[ex.id].reps;
            var repsUnit = document.createElement("span");
            repsUnit.className = "unit";
            repsUnit.textContent = "Wdh";
            reps.appendChild(repsInput);
            reps.appendChild(repsUnit);
            controls.appendChild(reps);

            if (ex.weight) {
              var kg = document.createElement("div");
              kg.className = "kg";
              var minus = document.createElement("button");
              minus.type = "button";
              minus.className = "step minus";
              minus.dataset.act = "minus";
              minus.dataset.id = ex.id;
              minus.setAttribute("aria-label", ex.name + " Gewicht senken");
              minus.textContent = "−";
              var kgInput = document.createElement("input");
              kgInput.dataset.kg = ex.id;
              kgInput.inputMode = "decimal";
              kgInput.autocomplete = "off";
              kgInput.setAttribute("aria-label", ex.name + " Gewicht in Kilogramm");
              var hint = document.createElement("span");
              hint.className = "unit";
              hint.dataset.kghint = ex.id;
              var unit = document.createElement("span");
              unit.className = "unit";
              unit.textContent = "kg";
              var plus = document.createElement("button");
              plus.type = "button";
              plus.className = "step plus";
              plus.dataset.act = "plus";
              plus.dataset.id = ex.id;
              plus.setAttribute("aria-label", ex.name + " Gewicht erhöhen");
              plus.textContent = "+";
              kg.appendChild(minus);
              kg.appendChild(kgInput);
              kg.appendChild(hint);
              kg.appendChild(unit);
              kg.appendChild(plus);
              controls.appendChild(kg);
            }

            item.appendChild(statEl);
            item.appendChild(controls);
          }

          listEl.appendChild(item);
        });
        paintMeta();
      }

      function renderHistory() {
        var logs = viewLogs();
        var dates = Log.historyDates(logs);
        historyEl.textContent = "";
        if (!dates.length) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "Noch kein Workout gespeichert.";
          historyEl.appendChild(empty);
          return;
        }
        var scroll = document.createElement("div");
        scroll.className = "table-scroll";
        var table = document.createElement("table");
        var thead = document.createElement("thead");
        var headRow = document.createElement("tr");
        var dateTh = document.createElement("th");
        dateTh.textContent = "Datum";
        headRow.appendChild(dateTh);
        Log.EXERCISES.forEach(function (ex) {
          var th = document.createElement("th");
          th.textContent = ex.short || ex.name;
          th.title = ex.name;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement("tbody");
        dates.forEach(function (iso) {
          var tr = document.createElement("tr");
          var td = document.createElement("td");
          var open = document.createElement("button");
          open.type = "button";
          open.dataset.open = iso;
          open.textContent = Log.formatDate(iso);
          td.appendChild(open);
          tr.appendChild(td);
          Log.EXERCISES.forEach(function (ex) {
            var cell = document.createElement("td");
            cell.textContent = Log.cellText(ex, Log.rowOn(logs, iso, ex.id));
            tr.appendChild(cell);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        var tfoot = document.createElement("tfoot");
        ["Ø", "Best"].forEach(function (label) {
          var tr = document.createElement("tr");
          var th = document.createElement("td");
          th.textContent = label;
          tr.appendChild(th);
          Log.EXERCISES.forEach(function (ex) {
            var cell = document.createElement("td");
            var stats = Log.statsFor(logs, ex);
            cell.textContent = label === "Ø" ? Log.avgText(ex, stats, logs) : Log.bestText(ex, stats);
            tr.appendChild(cell);
          });
          tfoot.appendChild(tr);
        });
        table.appendChild(tfoot);
        scroll.appendChild(table);
        historyEl.appendChild(scroll);
      }

      function clearTimers() {
        Object.keys(timers).forEach(function (id) { clearTimeout(timers[id]); });
      }

      function scheduleSave(ex, immediate) {
        clearTimeout(timers[ex.id]);
        var wait = immediate ? 0 : 350;
        timers[ex.id] = setTimeout(function () { saveExercise(ex); }, wait);
      }

      function saveExercise(ex) {
        var gen = ++generation;
        var when = date;
        var body = Log.payloadFromDraft(ex, draft[ex.id], Log.suggestionKg(serverLogs, ex.id, when));
        setStatus("Speichert …", false);
        tail = tail.then(function () {
          var request = !body
            ? rest(
              "go_natalya_logs?workout_date=eq." + encodeURIComponent(when) + "&exercise_id=eq." + encodeURIComponent(ex.id),
              { method: "DELETE", prefer: "return=minimal" }
            )
            : rest("go_natalya_logs?on_conflict=workout_date,exercise_id", {
              method: "POST",
              prefer: "resolution=merge-duplicates,return=minimal",
              body: {
                workout_date: when,
                exercise_id: ex.id,
                reps: body.reps,
                weight_kg: body.weight_kg,
                done: body.done,
                updated_at: new Date().toISOString()
              }
            });
          return request.then(function () {
            return rest("go_natalya_logs?select=workout_date,exercise_id,reps,weight_kg,done&order=workout_date.desc");
          }).then(function (rows) {
            if (gen !== generation) return;
            serverLogs = rows || [];
            showBanner("");
            setStatus("Gespeichert", false);
            paintMeta();
          }).catch(function (err) {
            if (gen !== generation) return;
            var text = explainError(err);
            setStatus(text, true);
            if (/Tabelle fehlt/.test(text)) showBanner(text);
          });
        });
      }

      function load() {
        setStatus("", false);
        rest("go_natalya_logs?select=workout_date,exercise_id,reps,weight_kg,done&order=workout_date.desc")
          .then(function (rows) {
            serverLogs = rows || [];
            draft = Log.draftFromLogs(serverLogs, date);
            showBanner("");
            renderList();
          })
          .catch(function (err) {
            serverLogs = [];
            draft = Log.draftFromLogs([], date);
            showBanner(explainError(err));
            renderList();
          });
      }

      function showTab(which) {
        var workout = which === "workout";
        workoutTab.classList.toggle("is-active", workout);
        historyTab.classList.toggle("is-active", !workout);
        workoutTab.setAttribute("aria-selected", workout ? "true" : "false");
        historyTab.setAttribute("aria-selected", workout ? "false" : "true");
        workoutPanel.hidden = !workout;
        historyPanel.hidden = workout;
        if (!workout) renderHistory();
      }

      dateInput.addEventListener("change", function () {
        clearTimers();
        date = dateInput.value || Log.berlinToday();
        dateInput.value = date;
        draft = Log.draftFromLogs(serverLogs, date);
        renderList();
      });

      workoutTab.addEventListener("click", function () { showTab("workout"); });
      historyTab.addEventListener("click", function () { showTab("history"); });

      listEl.addEventListener("click", function (event) {
        var check = event.target.closest("[data-check]");
        if (check) {
          var ex = Log.exerciseById(check.dataset.check);
          draft[ex.id].done = !draft[ex.id].done;
          paintMeta();
          scheduleSave(ex, true);
          return;
        }
        var step = event.target.closest("[data-act]");
        if (!step) return;
        var exercise = Log.exerciseById(step.dataset.id);
        var current = shownKg(exercise);
        var delta = step.dataset.act === "plus" ? exercise.step : -exercise.step;
        var next = current == null && delta < 0 ? null : Log.addKg(current == null ? 0 : current, delta);
        if (current == null && delta > 0) next = exercise.step;
        draft[exercise.id].kg = next;
        draft[exercise.id].kgTouched = next != null;
        paintMeta();
        scheduleSave(exercise, true);
      });

      listEl.addEventListener("input", function (event) {
        var reps = event.target.closest("[data-reps]");
        if (reps) {
          var ex = Log.exerciseById(reps.dataset.reps);
          draft[ex.id].reps = reps.value;
          paintMeta();
          scheduleSave(ex, false);
          return;
        }
        var kg = event.target.closest("[data-kg]");
        if (!kg) return;
        var exercise = Log.exerciseById(kg.dataset.kg);
        var raw = kg.value.trim();
        var parsed = Log.parseKg(raw);
        draft[exercise.id].kgTouched = true;
        kg.classList.remove("is-suggestion");
        var hint = document.querySelector('[data-kghint="' + exercise.id + '"]');
        if (hint) hint.textContent = "";
        if (raw && parsed == null) return;
        draft[exercise.id].kg = parsed;
        paintMeta();
        scheduleSave(exercise, false);
      });

      historyEl.addEventListener("click", function (event) {
        var open = event.target.closest("[data-open]");
        if (!open) return;
        date = open.dataset.open;
        dateInput.value = date;
        draft = Log.draftFromLogs(serverLogs, date);
        renderList();
        showTab("workout");
      });

      load();
    })();
  </script>
</body>
</html>
