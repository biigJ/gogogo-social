<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#C7413B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>gogogo · Login</title>
  <meta name="description" content="Login bei gogogo." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/go-orient-lock.css" />
  <script src="/assets/go-orient-lock.js" defer></script>
  <script src="/assets/go-account-session.js"></script>
  <script>
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #C7413B;
      --paper: #F7F5F0;
      --black: #0A0A0A;
      --ink: rgba(52, 34, 32, 0.9);
      --ink-on-red: rgba(247, 245, 240, 0.9);
      --btn-ink: rgba(170, 58, 52, 0.9);
      --placeholder: rgba(110, 88, 84, 0.9);
      --white: #ffffff;
      --max: 420px;
      --pad: 24px;
      --radius: 2px;
      --font: "Inter", system-ui, sans-serif;
      --display: "Space Grotesk", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; touch-action: manipulation; }

    body {
      font-family: var(--font);
      font-weight: 400;
      color: var(--ink-on-red);
      background: var(--red);
      -webkit-font-smoothing: antialiased;
      line-height: 1.45;
      min-height: 100svh;
      touch-action: manipulation;
      overscroll-behavior-x: none;
    }

    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 2px;
    }

    .wrap {
      width: min(100%, var(--max));
      margin: 0 auto;
      padding: calc(36px + env(safe-area-inset-top)) var(--pad) calc(40px + env(safe-area-inset-bottom));
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .cycle-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto;
    }

    .cycle {
      width: 240px;
      height: 240px;
      display: block;
    }

    .cycle-portrait {
      position: absolute;
      inset: 50%;
      width: 132px;
      height: 132px;
      margin: -66px 0 0 -66px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--red);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cycle-portrait img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      filter: invert(1);
      mix-blend-mode: screen;
      opacity: 0.75;
    }

    .field {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 14px 14px;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid transparent;
      border-radius: var(--radius);
      font-family: var(--display);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .field::placeholder { color: var(--placeholder); }

    .field:focus {
      outline: none;
      border-color: var(--ink);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      margin-top: 4px;
      background: var(--paper);
      color: var(--btn-ink);
      font-family: var(--display);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.03em;
      border-radius: var(--radius);
      text-decoration: none;
      transition: transform 0.08s ease, filter 0.08s ease;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:hover:not(:disabled) { opacity: 0.92; }
    .btn:active:not(:disabled) { transform: scale(0.97); filter: brightness(1.08); }

    .form-msg {
      min-height: 1.2em;
      margin-top: 12px;
      font-family: var(--display);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink-on-red);
    }

    .form-msg.is-error { text-decoration: underline; }

    .foot {
      text-align: center;
      font-family: var(--display);
      font-weight: 500;
      font-size: 12px;
      letter-spacing: -0.02em;
      color: var(--ink-on-red);
      padding-top: 32px;
    }

    .foot a:hover { text-decoration: underline; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <section class="hero" aria-label="Login">
      <div class="cycle-wrap">
        <svg class="cycle" id="cycle-hero" viewBox="0 0 240 240" width="240" height="240" aria-hidden="true"></svg>
        <div class="cycle-portrait">
          <img src="/assets/vitruvian.png" alt="" width="200" height="200" decoding="async" />
        </div>
      </div>
    </section>

    <form id="login-form" novalidate>
      <label class="visually-hidden" for="login-name">Vorname</label>
      <input
        class="field"
        id="login-name"
        name="given-name"
        type="text"
        autocomplete="given-name"
        autocapitalize="words"
        enterkeyhint="next"
        placeholder="Vorname"
        required
      />

      <label class="visually-hidden" for="login-code">Code</label>
      <input
        class="field"
        id="login-code"
        name="invite"
        type="text"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        enterkeyhint="done"
        placeholder="Code"
        required
      />

      <button class="btn" id="login-submit" type="submit" disabled>Login</button>
      <p class="form-msg" id="login-msg" role="status" aria-live="polite"></p>
    </form>

    <footer class="foot">
      <a href="/impressum/">Impressum</a>
      ·
      <a href="/datenschutz/">Datenschutz</a>
      ·
      <a href="/kontakt/">Kontakt</a>
    </footer>
  </div>

  <script>
    (function () {
      var SUPABASE_URL = "https://agpysewcsakdpmpftndp.supabase.co";
      var SUPABASE_KEY = "sb_publishable_xd3b3JYejCTc4zXaDmT6Qw_jYaLWCTQ";
      var SESSION_KEY = "gogogo_login_draft";

      var form = document.getElementById("login-form");
      var nameInput = document.getElementById("login-name");
      var codeInput = document.getElementById("login-code");
      var submitBtn = document.getElementById("login-submit");
      var msgEl = document.getElementById("login-msg");

      function drawCycle(svg, fillAll) {
        var ns = "http://www.w3.org/2000/svg";
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        var cx = 120, cy = 120, inner = 90, outer = 112, count = 28;
        var lit = {};
        if (!fillAll) {
          var pool = [];
          for (var i = 0; i < count; i++) pool.push(i);
          for (var r = pool.length - 1; r > 0; r--) {
            var j = Math.floor(Math.random() * (r + 1));
            var t = pool[r]; pool[r] = pool[j]; pool[j] = t;
          }
          var n = 16 + Math.floor(Math.random() * 6);
          for (var k = 0; k < n; k++) lit[pool[k]] = true;
        }
        for (var s = 0; s < count; s++) {
          var a = ((s / count) * Math.PI * 2) - Math.PI / 2;
          var line = document.createElementNS(ns, "line");
          line.setAttribute("x1", (cx + Math.cos(a) * inner).toFixed(2));
          line.setAttribute("y1", (cy + Math.sin(a) * inner).toFixed(2));
          line.setAttribute("x2", (cx + Math.cos(a) * outer).toFixed(2));
          line.setAttribute("y2", (cy + Math.sin(a) * outer).toFixed(2));
          var on = fillAll || lit[s];
          line.setAttribute("stroke", on ? "#F7F5F0" : "rgba(247,245,240,0.28)");
          line.setAttribute("stroke-width", "3");
          line.setAttribute("stroke-linecap", "round");
          svg.appendChild(line);
        }
      }

      drawCycle(document.getElementById("cycle-hero"), false);

      function saveDraft() {
        try {
          sessionStorage.setItem(SESSION_KEY, JSON.stringify({
            name: nameInput.value,
            code: codeInput.value
          }));
        } catch (e) {}
      }

      function restoreDraft() {
        try {
          var raw = sessionStorage.getItem(SESSION_KEY);
          if (!raw) return;
          var d = JSON.parse(raw);
          if (d.name) nameInput.value = d.name;
          if (d.code) codeInput.value = d.code;
        } catch (e) {}
      }

      restoreDraft();

      function updateSubmit() {
        submitBtn.disabled = !(nameInput.value.trim() && codeInput.value.trim());
      }

      [nameInput, codeInput].forEach(function (el) {
        el.addEventListener("input", function () { updateSubmit(); saveDraft(); });
        el.addEventListener("change", function () { updateSubmit(); saveDraft(); });
      });

      codeInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 4);
        updateSubmit();
        saveDraft();
      });

      updateSubmit();

      async function restGet(path) {
        var res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      function namesMatch(a, b) {
        return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
      }

      async function lookupAccount(name, invite) {
        if (!invite || !name) return null;
        var rows = await restGet(
          "go_accounts?invite_code=eq." + encodeURIComponent(invite) +
          "&select=*&order=created_at.asc&limit=50"
        );
        if (!rows || !rows.length) return null;
        var matches = [];
        var i;
        for (i = 0; i < rows.length; i++) {
          if (namesMatch(rows[i].name, name)) matches.push(rows[i]);
        }
        if (!matches.length) return null;
        for (i = 0; i < matches.length; i++) {
          if (matches[i].photo_url) return matches[i];
        }
        return matches[0];
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var name = nameInput.value.trim();
        var invite = codeInput.value.trim();
        if (!name || !invite) {
          msgEl.textContent = "Bitte Vorname und Code ausfüllen.";
          msgEl.classList.add("is-error");
          return;
        }
        msgEl.textContent = "Einen Moment …";
        msgEl.classList.remove("is-error");
        submitBtn.disabled = true;
        var account = null;
        try {
          account = await lookupAccount(name, invite);
        } catch (err) {}
        if (!account) {
          msgEl.textContent = "Kein Account zu diesem Namen und Code.";
          msgEl.classList.add("is-error");
          submitBtn.disabled = false;
          return;
        }
        try {
          if (window.GoAccountSession) GoAccountSession.save(account);
          else localStorage.setItem("gogogo_go_account", JSON.stringify(account));
          sessionStorage.removeItem(SESSION_KEY);
        } catch (err) {}
        window.location.href = "/account/";
      });
    })();
  </script>
</body>
</html>
